<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#100017" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Super Power Gym" />

    <title>Super Power Gym</title>
    <meta
      name="description"
      content="Super Power Gym: allenamento, schede, appuntamenti, progressi e gestione della palestra in un'unica app."
    />
    <meta name="author" content="Super Power Gym" />

    <meta property="og:title" content="Super Power Gym" />
    <meta
      property="og:description"
      content="Allenamento, schede, appuntamenti e gestione della palestra."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Super Power Gym" />
    <meta
      name="twitter:description"
      content="Allenamento, schede, appuntamenti e gestione della palestra."
    />
    <meta name="twitter:image" content="/og-image.png" />

    <link rel="icon" href="/favicon.ico" />
  </head>

  <body>
    <div id="root"></div>
    <script>
      (() => {
        const showStartupError = (detail) => {
          const root = document.getElementById("root");
          if (!root || root.childElementCount > 0) return;
          root.innerHTML = `<main style="min-height:100vh;padding:calc(env(safe-area-inset-top) + 32px) 24px 32px;background:#100017;color:#fff;font:16px system-ui"><h1 style="font-size:22px">Avvio non riuscito</h1><p>${detail}</p></main>`;
        };
        window.addEventListener("error", () => showStartupError("Si è verificato un errore durante il caricamento dell’app."));
        window.addEventListener("unhandledrejection", () => showStartupError("Il servizio non è disponibile. Riprova tra poco."));
        window.setTimeout(() => showStartupError("L’app sta impiegando troppo tempo ad avviarsi. Chiudila e riprova."), 8000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
